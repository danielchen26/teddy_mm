# ANM declaration (filled from metadata only, not yet sealed): TEDDY-G 70M + teddy_mm phase-1 protein head,
# ECCITE-seq (Papalexi et al. 2021; scPerturb v1.3 files): THP-1 monocytic cells stimulated with IFN-gamma,
# 25 targeted regulators of immune checkpoints, 4 surface proteins measured (CD86, PD-L1, PD-L2, TIM-3 = CD366).
# Question: knocking out the IFN-gamma signalling pathway lowers surface PD-L1 (and PD-L2). Where along
# RNA -> tokens -> TEDDY -> head -> predicted protein is that protein response lost?
# Filled from `python -m anm_diag inspect` and the obs/var tables only (no count matrix, no readout, no state):
#   one guide per cell in guide_id ("IFNGR1g3", non-targeting "NTg7"); the file's perturbation column is per guide;
#   replicate and stimulation in hto (rep1-tx ... rep4-tx; 4 cells rep2-ctrl were not stimulated); protein names
#   PDL1, PDL2.
anm_declaration: 1
name: teddy_mm_papalexi2021_ifng_pathway_pdl1
status: exploratory
kind: sufficiency

system:
  id: TEDDY-G-70M + teddy_mm phase-1 head (cite_phase1_official/best.pt)
  frozen: true
  inputs: [rna_counts]
  notes: >
    The head was trained on bone-marrow CITE-seq (NeurIPS 2021). THP-1 is a monocytic leukaemia line, closer
    to that training set than melanoma cells but still a shift. Declared choice: use the head as trained.
    Cells are taken by guide, intent-to-treat: no filtering by response-derived classes (no mixscape KO/NP labels),
    since those are computed from the RNA response itself. Targets are the guides' genes, so folds and resampling
    are per gene, not per guide. Genes reach TEDDY through the 10x GRCh38-3.0.0 symbol table that teddy_mm uses
    (tools/gene_map.py), because the file's own Ensembl ids put HLA and B2M genes and IFNGR2 outside TEDDY's
    vocabulary.

measurements:
  rna_counts: {modality: rna, kind: counts}
  adt_counts: {modality: protein, kind: counts}

source:
  controlled: true
  kind: crispr_ko
  stratum: [rep1-tx, rep2-tx, rep3-tx, rep4-tx]    # hto: IFN-gamma-stimulated cells only
  assign_from_guides: true
  control_guides: [NT]
  control: [control]
  treated: [IFNGR1, IFNGR2, JAK2, STAT1, IRF1]
  cluster: target
  max_control_cells: 4000       # the 2,386 non-targeting cells are all kept
  control_seed: 0

readouts:                       # 4-protein panel: CLR would be compositional, so log1p counts
  - {id: PDL1, measurement: adt_counts, statistic: adt_log1p, features: [PDL1]}
  - {id: PDL2, measurement: adt_counts, statistic: adt_log1p, features: [PDL2]}

measurement_sharing: none       # the readout is protein; no candidate reads protein

nodes:
  - {id: RAW,       from: rna_counts, op: log1p_cp10k,           operator: analysis, role: chain}
  - {id: TOKENS,    from: RAW,        op: teddy_official_tokens, operator: system,   role: chain}
  - {id: Z,         from: TOKENS,     op: teddy_embedding,       operator: system,   role: chain}
  - {id: HEAD_LAT,  from: Z,          op: head_latent,           operator: system,   role: chain}
  - {id: HEAD_OUT,  from: HEAD_LAT,   op: head_output,           operator: system,   role: chain}
  - {id: SET,       from: TOKENS,     op: drop_order,            operator: analysis, role: probe}
  - {id: MRNA_PDL1, from: RAW,        op: "rna_of_gene:CD274",   operator: analysis, role: probe}
  - {id: MRNA_PDL2, from: RAW,        op: "rna_of_gene:PDCD1LG2", operator: analysis, role: probe}
  - {id: ADT_PDL1,  from: adt_counts, op: "adt_readout:PDL1",    operator: analysis, role: positive_control, readout: PDL1}
  - {id: ADT_PDL2,  from: adt_counts, op: "adt_readout:PDL2",    operator: analysis, role: positive_control, readout: PDL2}

chain: [RAW, TOKENS, Z, HEAD_LAT, HEAD_OUT]

inference: {folds: 5, bootstrap: 1000, forward_bootstrap: 300, seed: 0, inverse: crossfit_partial_linear}
decision: {margin_u: 0.10, step_margin: 0.10, alpha: 0.05}
