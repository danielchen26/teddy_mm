# ANM declaration: TEDDY-G 70M on Replogle 2022 K562, mitochondrial-ribosome knockdown (KS-2 development cells)
anm_declaration: 1
name: ks2_teddy_mitoribo_dev
status: exploratory          # the design was settled after seeing these cells
kind: sufficiency

system:
  id: TEDDY-G-70M
  frozen: true
  inputs: [rna_counts]
  notes: official tokenisation (teddy_encoder.official_values + rank_encode_official), 12 encoder layers, gene-mean pooling

measurements:
  rna_counts: {modality: rna, kind: counts}

source:
  controlled: true
  kind: crispri
  control: control
  treated: "^MRP[LS]\\d"       # mitochondrial ribosomal protein targets
  cluster: target

readouts:
  - {id: MT,  measurement: rna_counts, statistic: mean_log1p_cp10k, features: "^MT-",          exclude_targets: true}
  - {id: PSM, measurement: rna_counts, statistic: mean_log1p_cp10k, features: "^PSM[ABCD]\\d+$", exclude_targets: true}

# the readouts are computed from the same counts TEDDY reads; count_split removes the shared counting noise
# but needs embeddings recomputed on the split counts (Mac); until then the sharing is declared
measurement_sharing: declared_shared

nodes:
  - {id: RAW,    from: rna_counts, op: log1p_cp10k,           operator: analysis, role: chain}
  - {id: TOKENS, from: RAW,        op: teddy_official_tokens, operator: system,   role: chain}
  - {id: Z,      from: TOKENS,     op: teddy_embedding,       operator: system,   role: chain}
  - {id: SET,    from: TOKENS,     op: drop_order,            operator: analysis, role: probe}
  - {id: DEPTH,  from: rna_counts, op: depth,                 operator: analysis, role: technical}
  - {id: READ_MT,  from: rna_counts, op: "readout_genes:MT",  operator: analysis, role: positive_control, readout: MT}
  - {id: READ_PSM, from: rna_counts, op: "readout_genes:PSM", operator: analysis, role: positive_control, readout: PSM}

chain: [RAW, TOKENS, Z]

inference: {folds: 5, bootstrap: 1000, forward_bootstrap: 300, seed: 0, inverse: crossfit_partial_linear}
decision: {margin_u: 0.10, alpha: 0.05}
