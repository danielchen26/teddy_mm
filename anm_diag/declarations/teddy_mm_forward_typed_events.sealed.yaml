# SEALED: do not edit. A changed design is a new declaration.
status: sealed
kind: forward
measurement_sharing: none
readout_classes:
  ridge:
    regressor: RidgeCV
    alphas:
    - 0.1
    - 0.31622776601683794
    - 1.0
    - 3.1622776601683795
    - 10.0
    - 31.622776601683793
    - 100.0
    - 316.22776601683796
    - 1000.0
    - 3162.2776601683795
    - 10000.0
    - 31622.776601683792
    - 100000.0
    classifier: LogisticRegression
    C: 0.05
  hgb:
    regressor: HistGradientBoostingRegressor
    classifier: HistGradientBoostingClassifier
    max_iter: 150
    learning_rate: 0.05
    max_leaf_nodes: 15
inference:
  folds: 5
  bootstrap: 1000
  forward_bootstrap: 300
  seed: 0
  standardize_on: control
decision:
  margin_u: 0.1
  step_margin: 0.1
  alpha: 0.05
  detection_floor: 10 x the largest of the precision error and the repeat difference
    on development cells, for states and readouts separately; a response counts as
    detected only above it
  step_tolerance: 0.25
  first_order: 'embed channel only: per site, the share of confirmatory cells passing,
    and the cell-mean slopes'
  reference: each site's response placed within the random-site distribution (descriptive,
    no threshold)
  intervals: cell bootstrap, 1000 draws, 95%
anm_declaration: 1
name: teddy_mm_forward_typed_events
version: 2
exploratory: true
exploratory_reason: 'Designed after the sealed inverse runs located a loss in the
  head; it asks how gene-level sources propagate step by step and how the head''s
  protein readout responds. Exploratory evidence (ANM paper p. 8).

  '
system:
  id: TEDDY-G-70M + teddy_mm phase-1 head (cite_phase1_official/best.pt)
  frozen: true
datasets:
  frangieh2021:
    declaration: declarations/teddy_mm_frangieh2021.yaml
    readouts:
    - CD274
    - HLA-A-B-C
    - HLA-E
  papalexi2021:
    declaration: declarations/teddy_mm_papalexi2021.yaml
    readouts:
    - CD274
baseline:
  cells: control
  development:
    n: 20
    seed: 1
  confirmatory:
    n: 100
    seed: 2
  sizes_reason: compute budget (about 2 x 22,000 TEDDY forward passes, roughly an
    hour on the MacBook Pro), fixed now
events:
  time: 0
  sites:
    pathway:
    - IFNGR1
    - IFNGR2
    - JAK1
    - JAK2
    - STAT1
    - IRF1
    readout_genes:
    - CD274
    - PDCD1LG2
    - HLA-A
    - HLA-B
    - HLA-C
    - B2M
    - HLA-E
    random:
      n: 12
      seed: 3
      from: genes in TEDDY's vocabulary that are tokens in >= 90% of development cells
  channels:
    count:
      eps:
      - 1.0
      - 0.5
      record:
      - rank shift
      - admitted or removed
      - number of tokens whose position moves
    embed:
      eps:
      - 0.2
      - 0.1
    z_direction:
      eps:
      - 1.0
      - 0.5
      random_directions:
        n: 12
        seed: 5
  signs:
  - 1
  - -1
  skip: a site with zero count (count channel), not among the cell's tokens (embed
    channel), or outside TEDDY's vocabulary (both) is skipped in that cell; skips
    are counted and reported per site
controls:
  routing:
    n: 2
    seed: 4
    sites: genes outside TEDDY's vocabulary
    expect: state and readout change exactly 0
  repeat: each development cell's baseline is run twice in the run's precision; reported
    as a determinism check
  precision: each development cell is also run in float64 on the CPU; the largest
    float32-vs-float64 difference is the numerical error of one forward pass
measurements:
  state:
  - input
  - layer_1
  - layer_2
  - layer_3
  - layer_4
  - layer_5
  - layer_6
  - layer_7
  - layer_8
  - layer_9
  - layer_10
  - layer_11
  - layer_12
  - Z
  - Z_UNIT
  - L1
  - H1
  - L2
  - H2
  - HEAD_LAT
  state_metric: relative displacement |dh| / |h|; Frobenius norm over real tokens
    for input and layers
  readout: head output log mean for the declared proteins, and the norm of the change
    over all 134
  slope: g(eps) = (O(+eps) - O(-eps)) / (2 eps)
reporting:
- 'per site and channel: propagation profile over steps, readout response, step check,
  skips'
- 'the count channel''s rank shifts, admissions and moved tokens: that is how the
  source reaches TEDDY; counts are scaled before normalization, so a scaled count
  need not be an integer'
- 'z_direction: the head''s response to the measured knockout direction, placed among
  the random directions'
- state and readout responses side by side; no gain decomposition beyond the linear
  case; a joint change is association under intervention, not mediation (SI S1.3)
- 'a model readout, not a measurement: this half says how the model responds, not
  whether a state is sufficient'
