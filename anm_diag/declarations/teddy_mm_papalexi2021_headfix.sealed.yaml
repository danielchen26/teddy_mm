system:
  id: TEDDY-G-70M + teddy_mm phase-1 head (cite_phase1_official/best.pt)
  frozen: true
  inputs:
  - rna_counts
  notes: 'The head was trained on bone-marrow CITE-seq (NeurIPS 2021). THP-1 is a
    monocytic leukaemia line, closer to that training set than melanoma cells but
    still a shift. Declared choice: use the head as trained. Cells are taken by guide,
    intent-to-treat: no filtering by response-derived classes (no mixscape KO/NP labels),
    since those are computed from the RNA response itself. Targets are the guides''
    genes, so folds and resampling are per gene, not per guide. Genes reach TEDDY
    through the 10x GRCh38-3.0.0 symbol table that teddy_mm uses (tools/gene_map.py),
    because the file''s own Ensembl ids put HLA and B2M genes and IFNGR2 outside TEDDY''s
    vocabulary.

    '
