anm_declaration: 1
name: teddy_mm_frangieh2021_ifng_pathway_headsplit
exploratory: true
exploratory_reason: 'Designed after the sealed headfix run, which located a resolved
  loss at Z -> HEAD_LAT. This run splits that step into teddy_mm''s own operations
  (unit-length input, linear 1, SiLU, linear 2, SiLU, linear 3) to locate it further.
  A method chosen after observing responses gives exploratory evidence and leaves
  the headfix classifications unchanged (ANM paper p. 8).

  '
system:
  id: TEDDY-G-70M + teddy_mm phase-1 head (cite_phase1_official/best.pt)
  frozen: true
  inputs:
  - rna_counts
  notes: 'The head was trained on bone-marrow CITE-seq (NeurIPS 2021); on melanoma
    cells it is out of its training distribution. Declared choice: use it as trained
    (head stages then test this head on new cells). Cells are labelled from their
    detected guides, not from the file''s perturbation column (which calls 13,316
    IFN-gamma cells "control" although they have no guide or guides for other genes):
    a control cell has only non-targeting guides, a treated cell only guides for one
    target gene (plus any non-targeting guides); cells with no guide or with guides
    for two genes are left out. Genes reach TEDDY through the 10x GRCh38-3.0.0 symbol
    table that teddy_mm uses (tools/gene_map.py): the file''s own Ensembl ids put
    HLA-A, -B, -C, -E, B2M and IFNGR2 on alternate-haplotype ids outside TEDDY''s
    vocabulary, which would drop exactly the MHC genes before TEDDY.

    '
measurements:
  rna_counts:
    modality: rna
    kind: counts
  adt_counts:
    modality: protein
    kind: counts
source:
  controlled: true
  kind: crispr_ko
  stratum: IFNγ
  assign_from_guides: true
  control_guides:
  - NO_SITE
  - ONE_NON-GENE_SITE
  control:
  - control
  treated:
  - IFNGR1
  - IFNGR2
  - JAK1
  - JAK2
  - STAT1
  cluster: target
  max_control_cells: 4000
  control_seed: 0
