kind: sufficiency
measurement_sharing: none
readout_classes:
  ridge:
    regressor: RidgeCV
    alphas:
    - 0.1
    - 0.31622776601683794
    - 1.0
    - 3.1622776601683795
    - 10.0
    - 31.622776601683793
    - 100.0
    - 316.22776601683796
    - 1000.0
    - 3162.2776601683795
    - 10000.0
    - 31622.776601683792
    - 100000.0
    classifier: LogisticRegression
    C: 0.05
  hgb:
    regressor: HistGradientBoostingRegressor
    classifier: HistGradientBoostingClassifier
    max_iter: 150
    learning_rate: 0.05
    max_leaf_nodes: 15
inference:
  folds: 5
  bootstrap: 1000
  forward_bootstrap: 300
  seed: 0
  standardize_on: control
  inverse: crossfit_partial_linear
decision:
  margin_u: 0.1
  step_margin: 0.1
  alpha: 0.05
anm_declaration: 1
name: frangieh2021_target_IFNGR1
system:
  id: TEDDY-G-70M + teddy_mm phase-1 head (cite_phase1_official/best.pt)
  frozen: true
  inputs:
  - rna_counts
  notes: 'The head was trained on bone-marrow CITE-seq (NeurIPS 2021); on melanoma
    cells it is out of its training distribution. Declared choice: use it as trained
    (head stages then test this head on new cells). Cells are labelled from their
    detected guides, not from the file''s perturbation column (which calls 13,316
    IFN-gamma cells "control" although they have no guide or guides for other genes):
    a control cell has only non-targeting guides, a treated cell only guides for one
    target gene (plus any non-targeting guides); cells with no guide or with guides
    for two genes are left out. Genes reach TEDDY through the 10x GRCh38-3.0.0 symbol
    table that teddy_mm uses (tools/gene_map.py): the file''s own Ensembl ids put
    HLA-A, -B, -C, -E, B2M and IFNGR2 on alternate-haplotype ids outside TEDDY''s
    vocabulary, which would drop exactly the MHC genes before TEDDY.

    '
measurements:
  rna_counts:
    modality: rna
    kind: counts
  adt_counts:
    modality: protein
    kind: counts
source:
  controlled: true
  kind: crispr_ko
  stratum: IFNγ
  assign_from_guides: true
  control_guides:
  - NO_SITE
  - ONE_NON-GENE_SITE
  control:
  - control
  treated:
  - IFNGR1
  cluster: guide
  max_control_cells: 4000
  control_seed: 0
readouts:
- id: MHC1
  measurement: adt_counts
  statistic: adt_clr
  features:
  - HLA_A
- id: PDL1
  measurement: adt_counts
  statistic: adt_clr
  features:
  - CD274
- id: HLAE
  measurement: adt_counts
  statistic: adt_clr
  features:
  - HLA_E
nodes:
- id: RAW
  from: rna_counts
  op: log1p_cp10k
  operator: analysis
  role: chain
- id: TOKENS
  from: RAW
  op: teddy_official_tokens
  operator: system
  role: chain
- id: Z
  from: TOKENS
  op: teddy_embedding
  operator: system
  role: chain
- id: HEAD_LAT
  from: Z
  op: head_latent
  operator: system
  role: chain
- id: HEAD_OUT
  from: HEAD_LAT
  op: head_output
  operator: system
  role: chain
- id: SET
  from: TOKENS
  op: drop_order
  operator: analysis
  role: probe
- id: MRNA_HLA
  from: RAW
  op: rna_of_gene:HLA-A,HLA-B,HLA-C,B2M
  operator: analysis
  role: probe
- id: MRNA_PDL1
  from: RAW
  op: rna_of_gene:CD274
  operator: analysis
  role: probe
- id: MRNA_HLAE
  from: RAW
  op: rna_of_gene:HLA-E
  operator: analysis
  role: probe
- id: ADT_MHC1
  from: adt_counts
  op: adt_readout:MHC1
  operator: analysis
  role: positive_control
  readout: MHC1
- id: ADT_PDL1
  from: adt_counts
  op: adt_readout:PDL1
  operator: analysis
  role: positive_control
  readout: PDL1
- id: ADT_HLAE
  from: adt_counts
  op: adt_readout:HLAE
  operator: analysis
  role: positive_control
  readout: HLAE
chain:
- RAW
- TOKENS
- Z
- HEAD_LAT
- HEAD_OUT
status: exploratory
