kind: sufficiency
measurement_sharing: none
readout_classes:
  ridge:
    regressor: RidgeCV
    alphas:
    - 0.1
    - 0.31622776601683794
    - 1.0
    - 3.1622776601683795
    - 10.0
    - 31.622776601683793
    - 100.0
    - 316.22776601683796
    - 1000.0
    - 3162.2776601683795
    - 10000.0
    - 31622.776601683792
    - 100000.0
    classifier: LogisticRegression
    C: 0.05
  hgb:
    regressor: HistGradientBoostingRegressor
    classifier: HistGradientBoostingClassifier
    max_iter: 150
    learning_rate: 0.05
    max_leaf_nodes: 15
inference:
  folds: 5
  bootstrap: 1000
  forward_bootstrap: 300
  seed: 0
  standardize_on: control
  inverse: crossfit_partial_linear
decision:
  margin_u: 0.1
  step_margin: 0.1
  alpha: 0.05
anm_declaration: 1
name: loop_transfer_frangieh2021_decoder_only
system:
  id: TEDDY-G-70M + teddy_mm phase-1 head (cite_phase1_official/best.pt)
  frozen: true
  inputs:
  - rna_counts
  notes: 'Closed-loop test, see DESIGN.md. Head: the head with only its decoder retrained.
    Cells: all cells; the head was fitted on papalexi2021 only. No head was fitted
    on any audited cell. The head was trained on bone-marrow CITE-seq (NeurIPS 2021);
    on melanoma cells it is out of its training distribution. Declared choice: use
    it as trained (head stages then test this head on new cells). Cells are labelled
    from their detected guides, not from the file''s perturbation column (which calls
    13,316 IFN-gamma cells "control" although they have no guide or guides for other
    genes): a control cell has only non-targeting guides, a treated cell only guides
    for one target gene (plus any non-targeting guides); cells with no guide or with
    guides for two genes are left out. Genes reach TEDDY through the 10x GRCh38-3.0.0
    symbol table that teddy_mm uses (tools/gene_map.py): the file''s own Ensembl ids
    put HLA-A, -B, -C, -E, B2M and IFNGR2 on alternate-haplotype ids outside TEDDY''s
    vocabulary, which would drop exactly the MHC genes before TEDDY.

    '
measurements:
  rna_counts:
    modality: rna
    kind: counts
  adt_counts:
    modality: protein
    kind: counts
source:
  controlled: true
  kind: crispr_ko
  stratum: IFNγ
  assign_from_guides: true
  control_guides:
  - NO_SITE
  - ONE_NON-GENE_SITE
  control:
  - control
  treated:
  - IFNGR1
  - IFNGR2
  - JAK1
  - JAK2
  - STAT1
  cluster: target
  max_control_cells: 4000
  control_seed: 0
readouts:
- id: MHC1
  measurement: adt_counts
  statistic: adt_clr
  features:
  - HLA_A
- id: PDL1
  measurement: adt_counts
  statistic: adt_clr
  features:
  - CD274
- id: HLAE
  measurement: adt_counts
  statistic: adt_clr
  features:
  - HLA_E
nodes:
- id: Z
  from: rna_counts
  op: teddy_embedding
  operator: system
  role: chain
- id: HEAD_LAT
  from: Z
  op: head_latent
  operator: system
  role: chain
- id: HEAD_OUT
  from: HEAD_LAT
  op: head_output
  operator: system
  role: chain
chain:
- Z
- HEAD_LAT
- HEAD_OUT
status: exploratory
