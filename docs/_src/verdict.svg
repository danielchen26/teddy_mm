<svg viewBox="0 0 860 214" role="img" data-al-zh="u 的数轴上，容差带是负 0.10 到正 0.10。区间整个在带内是支持，跨过带的边是未决，每一类读出都在带外是否定。" data-al-en="On the u axis the margin band runs from minus 0.10 to plus 0.10. An interval wholly inside the band is support, one crossing its edge is unresolved, and every readout class outside the band is rejection.">
      <rect class="band" x="210" y="26" width="140" height="132"/>
      <line class="ax" x1="40" y1="158" x2="820" y2="158"/>
      <g font-size="11.5" text-anchor="middle" class="t-m">
        <line class="ax" x1="70" y1="158" x2="70" y2="164"/><text x="70" y="180">−0.3</text>
        <line class="ax" x1="210" y1="158" x2="210" y2="164"/><text x="210" y="180">−0.1</text>
        <line class="ax" x1="280" y1="158" x2="280" y2="164"/><text x="280" y="180">0</text>
        <line class="ax" x1="350" y1="158" x2="350" y2="164"/><text x="350" y="180">+0.1</text>
        <line class="ax" x1="490" y1="158" x2="490" y2="164"/><text x="490" y="180">+0.3</text>
        <line class="ax" x1="630" y1="158" x2="630" y2="164"/><text x="630" y="180">+0.5</text>
      </g>
      <text class="zh" x="280" y="204" font-size="12" text-anchor="middle">容差带 (−ε, ε)，这里 ε = 0.10</text>
      <text class="en" x="280" y="204" font-size="12" text-anchor="middle">Margin band (−ε, ε), here ε = 0.10</text>
      <text x="790" y="180" font-size="12" text-anchor="middle" class="t-m">u</text>
      <g stroke-width="2.5" stroke-linecap="butt">
        <line x1="273" y1="50" x2="343" y2="50" style="stroke:var(--s1)"/>
        <line x1="301" y1="92" x2="419" y2="92" style="stroke:var(--s2)"/>
        <line x1="374.5" y1="126" x2="459" y2="126" style="stroke:var(--s1)"/>
        <line x1="546" y1="140" x2="613" y2="140" style="stroke:var(--s2)"/>
      </g>
      <g>
        <circle cx="309.4" cy="50" r="4.5" style="fill:var(--s1);stroke:var(--accent-tint);stroke-width:2"/>
        <circle cx="362.6" cy="92" r="4.5" style="fill:var(--s2);stroke:var(--panel);stroke-width:2"/>
        <circle cx="423.5" cy="126" r="4.5" style="fill:var(--s1);stroke:var(--panel);stroke-width:2"/>
        <circle cx="581.7" cy="140" r="4.5" style="fill:var(--s2);stroke:var(--panel);stroke-width:2"/>
      </g>
      <g font-size="12.5" class="zh">
        <text x="440" y="46" font-weight="600">支持</text><text x="476" y="46" class="t-mu">某一类读出模型的整个区间在带内</text>
        <text x="440" y="64" class="t-mu" font-size="11.5">例：Z，ridge，+0.04 [−0.01, +0.09]</text>
        <text x="440" y="96" font-weight="600">未决</text><text x="476" y="96" class="t-mu">区间跨过带的边（同一环的 HGB）</text>
        <text x="650" y="130" font-weight="600">否定</text><text x="686" y="130" class="t-mu">每一类都在带外</text>
        <text x="650" y="148" class="t-mu" font-size="11.5">例：HEAD_LAT 的 ridge 和 HGB</text>
      </g>
      <g font-size="12.5" class="en">
        <text x="440" y="46" font-weight="600">Support</text><text x="498" y="46" class="t-mu">one readout class lies wholly inside the band</text>
        <text x="440" y="64" class="t-mu" font-size="11.5">e.g. Z, ridge, +0.04 [−0.01, +0.09]</text>
        <text x="440" y="96" font-weight="600">Unresolved</text><text x="518" y="96" class="t-mu">the interval crosses the band's edge (HGB, same stage)</text>
        <text x="650" y="130" font-weight="600">Reject</text><text x="698" y="130" class="t-mu">every class is outside</text>
        <text x="650" y="148" class="t-mu" font-size="11.5">e.g. ridge and HGB at HEAD_LAT</text>
      </g>
    </svg>
